  <text x="22" y="106" font-size="15" fill="#e8e8e8">Data &amp; ML Engineer</text>
  <text x="22" y="130" font-size="13" fill="#6a6a6a">B.S. Data Science &amp; Artificial Intelligence — Florida International University</text>

  <text x="22" y="172" font-size="15">
    <tspan fill="#00ff88">fesal</tspan><tspan fill="#6a6a6a">@</tspan><tspan fill="#4ea1ff">fayed</tspan><tspan fill="#6a6a6a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#6a6a6a">$ </tspan><tspan fill="#e8e8e8">cat about.md</tspan>
  </text>
  <text x="22" y="198" font-size="15"><tspan fill="#e8e8e8">I build </tspan><tspan fill="#00ff88">agents</tspan><tspan fill="#e8e8e8"> and fine-tune </tspan><tspan fill="#00ff88">models</tspan><tspan fill="#e8e8e8">. I turn siloed sources into structured</tspan></text>
  <text x="22" y="222" font-size="15" fill="#e8e8e8">signal you can actually do something with.</text>

  <text x="22" y="264" font-size="15">
    <tspan fill="#00ff88">fesal</tspan><tspan fill="#6a6a6a">@</tspan><tspan fill="#4ea1ff">fayed</tspan><tspan fill="#6a6a6a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#6a6a6a">$ </tspan><tspan fill="#00ff88">█</tspan>
  </text>

